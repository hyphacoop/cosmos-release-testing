        runs-on: ubuntu-24.04
        needs: [set-versions, build-binary]
        if: ${{ !cancelled() && needs.set-versions.result == 'success' }}
        strategy:
          matrix:
            start_version: [ "${{ needs.set-versions.outputs.start_version }}" ]
            target_version: [ "${{ needs.set-versions.outputs.target_version }}" ]
            upgrade_name: [ "${{ needs.set-versions.outputs.upgrade_name }}" ]
          fail-fast: false
        env:
          COSMOVISOR: false
          BINARY_SOURCE: ${{ needs.set-versions.outputs.binary_source }}
          COMMIT_TIMEOUT: 3
          VESTING_AMOUNT: 110000000
          VESTING_DELEGATED_AMOUNT: 100000000
        steps:
          - name: Update PATH
            run: |
              mkdir -p $HOME/go/bin
              echo "$HOME/go/bin" >> $GITHUB_PATH
              echo "$HOME/.hermes" >> $GITHUB_PATH
              echo "$HOME/.relayer" >> $GITHUB_PATH
          - name: Download pre-built gaiad binary
            if: needs.set-versions.outputs.binary_source == 'BUILD'
            uses: actions/download-artifact@v7
            with:
              name: gaiad-binary
              path: ./prebuilt-gaiad
          - name: Install pre-built gaiad binary
            if: needs.set-versions.outputs.binary_source == 'BUILD'
            run: |
              cp ./prebuilt-gaiad/gaiad $HOME/go/bin/gaiad
              chmod +x $HOME/go/bin/gaiad
          - name: Bypass the grub-efi-amd64-signed package
            run: sudo apt-mark hold grub-efi-amd64-signed
          - name: Check out repository code
            uses: actions/checkout@v6
          - name: Set up Python
            uses: actions/setup-python@v6
            with:
              python-version: '3.11'
          - name: Install dependencies
            run: |
              python -m pip install --upgrade pip
              python -m pip install toml-cli asyncio websockets requests urllib3 bech32

          - name: Set up relayer
            run: |
              source scripts/vars.sh
              scripts/setup_relayer.sh

          - name: Start chain
            run: |
              export CHAIN_BINARY_URL=https://github.com/cosmos/gaia/releases/download/${{ matrix.start_version }}/gaiad-${{ matrix.start_version }}-linux-amd64  
              source scripts/vars.sh
              export validator_count=12
              export MAX_VALIDATORS=8
              export MAX_PROVIDER_VALIDATORS=5
              scripts/setup.sh
              ./$START_SCRIPT
              sleep $(($COMMIT_TIMEOUT*2))
              tail -n 100 $whale_log
              scripts/wait_for_block.sh $whale_rpc 3              

          - name: Start relayer
            run: |
              scripts/start_relayer.sh
              sleep $(($COMMIT_TIMEOUT*3))
              
          - name: Start pfm1 chain
            run: |
              export CHAIN_BINARY_URL=https://github.com/cosmos/gaia/releases/download/${{ matrix.start_version }}/gaiad-${{ matrix.start_version }}-linux-amd64  
              source scripts/vars_pfm_1.sh
              scripts/setup.sh
              ./$START_SCRIPT
              sleep $(($COMMIT_TIMEOUT*2))
              tail -n 100 $whale_log
              scripts/wait_for_block.sh $whale_rpc 3

          - name: Start pfm2 chain
            run: |
              export CHAIN_BINARY_URL=https://github.com/cosmos/gaia/releases/download/${{ matrix.start_version }}/gaiad-${{ matrix.start_version }}-linux-amd64  
              source scripts/vars_pfm_2.sh
              scripts/setup.sh
              ./$START_SCRIPT
              sleep $(($COMMIT_TIMEOUT*2))
              tail -n 100 $whale_log
              scripts/wait_for_block.sh $whale_rpc 3

          - name: Start pfm3 chain
            run: |
              export CHAIN_BINARY_URL=https://github.com/cosmos/gaia/releases/download/${{ matrix.start_version }}/gaiad-${{ matrix.start_version }}-linux-amd64  
              source scripts/vars_pfm_3.sh
              scripts/setup.sh
              ./$START_SCRIPT
              sleep $(($COMMIT_TIMEOUT*2))
              tail -n 100 $whale_log
              scripts/wait_for_block.sh $whale_rpc 3

          - name: Create transfer channels for PFM test
            run: |
              tmux send-keys -t relayer C-c
              sleep $(($COMMIT_TIMEOUT*2))
              source scripts/vars.sh
              if [ $RELAYER == "hermes" ]; then
                echo "Creating channels with Hermes..."
                hermes create channel --new-client-connection --a-chain $CHAIN_ID --b-chain pfm1 --a-port transfer --b-port transfer --yes
                hermes create channel --new-client-connection --a-chain pfm1 --b-chain pfm2 --a-port transfer --b-port transfer --yes
                hermes create channel --new-client-connection --a-chain pfm2 --b-chain pfm3 --a-port transfer --b-port transfer --yes
              elif [ $RELAYER == "rly" ]; then
                echo "Creating channel with Go relayer..."
                echo "Paths"
                rly paths new testnet pfm1 pfm-path-1
                rly paths new pfm1 pfm2 pfm-path-2
                rly paths new pfm2 pfm3 pfm-path-3
                echo "Clients"
                rly transact client testnet pfm1 pfm-path-1
                rly transact client pfm1 pfm2 pfm-path-2
                rly transact client pfm2 pfm3 pfm-path-3
                sleep $(($COMMIT_TIMEOUT*2))
                echo "Connections"
                rly transact connection pfm-path-1
                rly transact connection pfm-path-2
                rly transact connection pfm-path-3
                sleep $(($COMMIT_TIMEOUT*2))
                echo "Channels"
                rly transact channel pfm-path-1
                rly transact channel pfm-path-2
                rly transact channel pfm-path-3
              fi
              scripts/start_relayer.sh

          - name: Restart relayer
            run: |
              tmux send-keys -t relayer C-c
              sleep $(($COMMIT_TIMEOUT*2))
              scripts/start_relayer.sh

          - name: Store channel IDs for PFM test
            run: |
              scripts/store_pfm_channel_ids.sh

          - name: _Test PFM transfers
            run: |
              tests/test_pfm_transfers.sh

          - name: Set up happy path liquid accounts
            run: |
              source scripts/vars.sh
              scripts/lsm_account_setup.sh

          - name: Pre-upgrade x/liquid happy path
            run: |
              source scripts/vars.sh
              tests/test_liquid_happy_path.sh
    
          - name: Tokenize with upgrade_wallet
            run: |
              source scripts/vars.sh
              upgrade_wallet=$($CHAIN_BINARY keys list --home $whale_home --output json | jq -r '.[] | select(.name=="upgrade_wallet").address')
              echo "> Delegating."
              $CHAIN_BINARY tx staking delegate $VALOPER_1 1000000uatom --from upgrade_wallet -o json --gas auto --gas-adjustment $GAS_ADJUSTMENT --gas-prices $GAS_PRICE -y --home $whale_home
              sleep $(($COMMIT_TIMEOUT+2))
              echo "> Tokenizing."
              echo "> Command: $CHAIN_BINARY tx liquid tokenize-share $VALOPER_1 1000000$DENOM $upgrade_wallet --from upgrade_wallet -o json --gas auto --gas-adjustment $GAS_ADJUSTMENT --gas-prices $GAS_PRICE -y --home $whale_home"
              $CHAIN_BINARY tx liquid tokenize-share $VALOPER_1 1000000$DENOM $upgrade_wallet --from upgrade_wallet -o json --gas auto --gas-adjustment $GAS_ADJUSTMENT --gas-prices $GAS_PRICE -y --home $whale_home
              sleep $(($COMMIT_TIMEOUT+2))
              $CHAIN_BINARY q bank balances $upgrade_wallet --home $whale_home -o json | jq '.'

          - name: Redeem tokens with upgrade_wallet
            run: |
              source scripts/vars.sh
              upgrade_wallet=$($CHAIN_BINARY keys list --home $whale_home --output json | jq -r '.[] | select(.name=="upgrade_wallet").address')
              $CHAIN_BINARY q bank balances $upgrade_wallet --home $whale_home -o json | jq '.'
              liquid_denom=$($CHAIN_BINARY q bank balances $upgrade_wallet --home $whale_home -o json | jq -r --arg valoper "$VALOPER_1" '.balances | map(select(.denom | startswith($valoper))) | .[-1].denom')
              $CHAIN_BINARY q staking delegations $upgrade_wallet --home $whale_home -o json | jq '.'
              starting_delegation_amount=$($CHAIN_BINARY q staking delegations $upgrade_wallet --home $whale_home -o json | jq -r '.delegation_responses[0].balance.amount')
              echo "> Denom: $liquid_denom"
              echo "> Command: $CHAIN_BINARY tx liquid redeem-tokens 1000000$liquid_denom --from $whale_home -o json --gas auto --gas-adjustment $GAS_ADJUSTMENT --gas-prices $GAS_PRICE -y --home $whale_home"
              $CHAIN_BINARY tx liquid redeem-tokens 1000000$liquid_denom --from $upgrade_wallet -o json --gas auto --gas-adjustment $GAS_ADJUSTMENT --gas-prices $GAS_PRICE -y --home $whale_home
              sleep $(($COMMIT_TIMEOUT+2))
              $CHAIN_BINARY q bank balances $upgrade_wallet --home $whale_home -o json | jq '.'
              $CHAIN_BINARY q staking delegations $upgrade_wallet --home $whale_home -o json | jq '.'
              ending_delegation_amount=$($CHAIN_BINARY q staking delegations $upgrade_wallet --home $whale_home -o json | jq -r '.delegation_responses[0].balance.amount')
              diff=$(echo "$ending_delegation_amount - $starting_delegation_amount" | bc)
              echo "> Difference in delegation amount: $diff"
              if [[ "$diff" == "1000000" ]]; then
                  echo "Token redemption succeeded."
              else
                  echo "Token redemption failed."
                  exit 1
              fi
    
          - name: Set up vesting account
            run: |
              source scripts/vars.sh
              echo "Creating vesting wallet..."
              $CHAIN_BINARY keys add vesting --home $whale_home
              vesting_wallet=$($CHAIN_BINARY keys list --home $whale_home --output json | jq -r '.[] | select(.name=="vesting").address')
              start_time=$(date +%s)
              echo "start time: $start_time"
              end_time=$(date -d '10 minutes'  +%s)
              echo "end time: $end_time"
              $CHAIN_BINARY tx vesting create-vesting-account \
              $vesting_wallet $VESTING_AMOUNT$DENOM $end_time \
              --from $WALLET_1 --home $whale_home \
              --gas $GAS --gas-adjustment $GAS_ADJUSTMENT --gas-prices $GAS_PRICE -y
              sleep 1m
    
              echo "Saving vesting times..."
              duration=$(echo "$end_time - $start_time" | bc -l)
              echo "duration: $duration"
              echo "vesting_start_time=$start_time" >> $GITHUB_ENV
              echo "vesting_end_time=$end_time" >> $GITHUB_ENV
              echo "vesting_duration=$duration" >> $GITHUB_ENV
  
          - name: Delegate with vesting wallet
            run: |
              source scripts/vars.sh
              vesting_wallet=$($CHAIN_BINARY keys list --home $whale_home --output json | jq -r '.[] | select(.name=="vesting").address')
              $CHAIN_BINARY q bank spendable-balances $vesting_wallet --home $whale_home -o json | jq '.'
              echo "Delegating from vesting wallet..."
              $CHAIN_BINARY tx staking delegate $VALOPER_1 $VESTING_DELEGATED_AMOUNT$DENOM \
              --from $vesting_wallet --home $whale_home \
              --gas $GAS --gas-adjustment $GAS_ADJUSTMENT --gas-prices $GAS_PRICE -y      
    
          - name: Start host chain
            run: |
              export CHAIN_BINARY_URL=https://github.com/cosmos/gaia/releases/download/${{ matrix.start_version }}/gaiad-${{ matrix.start_version }}-linux-amd64  
              source scripts/vars_ica.sh
              scripts/setup.sh
              ./$START_SCRIPT
              sleep $(($COMMIT_TIMEOUT*2))
              tail -n 100 $whale_log
              scripts/wait_for_block.sh $whale_rpc 3

          - name: Generate host connection
            env:
              CHAIN_1: testnet
              CHAIN_2: ica
            run: |
              tmux send-keys -t relayer C-c
              sleep $(($COMMIT_TIMEOUT*2))
              hermes create client --host-chain $CHAIN_1 --reference-chain $CHAIN_2
              hermes create client --reference-chain $CHAIN_1 --host-chain $CHAIN_2
              source scripts/vars.sh
              ica_client_id=$($CHAIN_BINARY q ibc client states -o json --home $whale_home | jq -r --arg chain "$CHAIN_2" '.client_states[] | select(.client_state.chain_id==$chain).client_id')
              echo "> Creating connection with Hermes"
              hermes create connection --a-chain $CHAIN_1 --a-client $ica_client_id --b-client 07-tendermint-0
              ica_connection_id=$($CHAIN_BINARY q ibc connection connections -o json --home $whale_home | jq -r --arg client "$ica_client_id" '.connections[] | select((.client_id==$client) and (.state=="STATE_OPEN")).id')
              
              printf ">Saving variables to GITHUB_ENV.\n"
              echo "ica_client_id=$ica_client_id" >> $GITHUB_ENV
              echo "ica_connection_id=$ica_connection_id" >> $GITHUB_ENV
              scripts/start_relayer.sh

          - name: _Test ICA controller - register ICA with controller1
            run: |
              source scripts/vars.sh
              echo "> Registering ICA."
              $CHAIN_BINARY keys add controller1 --home $whale_home
              controller1=$($CHAIN_BINARY keys list --home $whale_home --output json | jq -r '.[] | select(.name=="controller1").address')
              txhash=$($CHAIN_BINARY tx bank send $WALLET_1 $controller1 100000000$DENOM --gas auto --gas-adjustment $GAS_ADJUSTMENT --gas-prices $GAS_PRICE -y -o json --home $whale_home | jq -r '.txhash')
              sleep $(($COMMIT_TIMEOUT*2))
              echo "> Controller fund tx:"
              $CHAIN_BINARY q tx $txhash --home $whale_home -o json | jq '.'
              echo "> Controller account balances:"
              $CHAIN_BINARY q bank balances $controller1 --home $whale_home
              echo "> Register controller"
              txhash=$($CHAIN_BINARY tx interchain-accounts controller register $ica_connection_id --ordering ORDER_ORDERED --version "" --from $controller1 --gas auto --gas-adjustment $GAS_ADJUSTMENT --gas-prices $GAS_PRICE -y -o json --home $whale_home | jq -r '.txhash')
              sleep $(($COMMIT_TIMEOUT*15))
              echo "txhash: $txhash"
              $CHAIN_BINARY q tx $txhash --home $whale_home -o json | jq '.'
              tail -n 100 relayer.log
              tail -n 100 $whale_log
              ica_address=$($CHAIN_BINARY q interchain-accounts controller interchain-account $controller1 $ica_connection_id --home $whale_home -o json | jq -r '.address')
              echo "ICA address: $ica_address"
              echo "> Funding ICA."
              source scripts/vars_ica.sh
              $CHAIN_BINARY tx bank send $WALLET_1 $ica_address 100000000$DENOM --gas $GAS --gas-adjustment $GAS_ADJUSTMENT --gas-prices $GAS_PRICE -y -o json --home $whale_home
              sleep $(($COMMIT_TIMEOUT*3))

          - name: _Test ICA send
            run: |
              source scripts/vars.sh
              controller1=$($CHAIN_BINARY keys list --home $whale_home --output json | jq -r '.[] | select(.name=="controller1").address')
              $CHAIN_BINARY keys add recipient1 --home $whale_home
              recipient_wallet=$($CHAIN_BINARY keys list --home $whale_home --output json | jq -r '.[] | select(.name=="recipient1").address')
              tests/test_ica_send.sh $controller1 $recipient_wallet

          - name: _Test counter contract
            run: |
              source scripts/vars.sh
              tests/test_contract_counter.sh

          - name: _Test multisig contract
            run: |
              source scripts/vars.sh
              tests/test_contract_multisig.sh

          - name: _Test feemarket
            run: |
              source scripts/vars.sh
              tests/test_feemarket.sh

          - name: _Test auth module
            run: |
              source scripts/vars.sh
              tests/test_auth.sh

          - name: _Test authz module
            run: |
              source scripts/vars.sh
              tests/test_authz.sh

          - name: Test software upgrade cancellation - proposer tx
            env:
              TARGET_VERSION: ${{ matrix.target_version }}
              DOWNLOAD_URL: https://github.com/cosmos/gaia/releases/download/${{ matrix.target_version }}/gaiad-${{ matrix.target_version }}-linux-amd64
            run: |
              source scripts/vars.sh
              export validator_count=12
              scripts/upgrade_cancel_tx.sh ${{ matrix.upgrade_name }}

          - name: Test software upgrade cancellation - cancel software upgrade proposal
            env:
              TARGET_VERSION: ${{ matrix.target_version }}
              DOWNLOAD_URL: https://github.com/cosmos/gaia/releases/download/${{ matrix.target_version }}/gaiad-${{ matrix.target_version }}-linux-amd64
            run: |
              source scripts/vars.sh
              export validator_count=12
              scripts/upgrade_cancel_proposal.sh ${{ matrix.upgrade_name }}

          - name: Test software upgrade cancellation - skip upgrade height through early staging
            env:
              TARGET_VERSION: ${{ matrix.target_version }}
              DOWNLOAD_URL: https://github.com/cosmos/gaia/releases/download/${{ matrix.target_version }}/gaiad-${{ matrix.target_version }}-linux-amd64
            run: |
              source scripts/vars.sh
              export validator_count=12
              export START_SKIP_SCRIPT="start_skip.sh"
              scripts/upgrade_skip_early_staging.sh ${{ matrix.upgrade_name }}

          - name: Test software upgrade cancellation - skip upgrade height after it has been reached
            env:
              TARGET_VERSION: ${{ matrix.target_version }}
              DOWNLOAD_URL: https://github.com/cosmos/gaia/releases/download/${{ matrix.target_version }}/gaiad-${{ matrix.target_version }}-linux-amd64
            run: |
              source scripts/vars.sh
              export validator_count=12
              export START_SKIP_SCRIPT="start_skip.sh"
              scripts/upgrade_skip.sh ${{ matrix.upgrade_name }}

          - name: _Blocks produced after cancelled upgrade
            run: |
              source scripts/vars.sh
              tests/test_block_production.sh 127.0.0.1 $whale_rpc 5

          - name: _Blocks produced after upgrade
            run: |
              source scripts/vars.sh
              tests/test_block_production.sh 127.0.0.1 $whale_rpc 5

          - name: Test software upgrade
            env:
              TARGET_VERSION: ${{ matrix.target_version }}
            run: |
              export DOWNLOAD_URL=https://github.com/cosmos/gaia/releases/download/${TARGET_VERSION}/gaiad-${TARGET_VERSION}-linux-amd64  
              export OPERATION=${{ matrix.operation }}
              source scripts/vars.sh
              export validator_count=12
              export MAX_VALIDATORS=8
              export MAX_PROVIDER_VALIDATORS=5
              scripts/upgrade.sh ${{ matrix.upgrade_name }}

          - name: _Blocks produced after upgrade
            run: |
              source scripts/vars.sh
              tests/test_block_production.sh 127.0.0.1 ${rpc_prefix}$COUNT_WIDTH 5

          - name: Delegate to validators
            run: |
              source scripts/vars.sh
              export validator_count=12
              export MAX_VALIDATORS=8
              export MAX_PROVIDER_VALIDATORS=5
              echo "> Outstanding rewards for Val1 before delegation:"
              $CHAIN_BINARY q distribution validator-outstanding-rewards $VALOPER_1 --home $whale_home -o json | jq '.'
              echo "> Pre-delegation tokens:"
              $CHAIN_BINARY q staking validator $VALOPER_1 --home $whale_home -o json | jq '.validator.tokens'
              $CHAIN_BINARY tx staking delegate $VALOPER_1 1000000$DENOM --from $WALLET_1 --home $whale_home --gas auto --gas-adjustment $GAS_ADJUSTMENT --gas-prices $GAS_PRICE -o json -y | jq '.'
              sleep $(($COMMIT_TIMEOUT*2)) 
              $CHAIN_BINARY tx staking delegate $VALOPER_1 1000000$DENOM --from $WALLET_1 --home $whale_home --gas auto --gas-adjustment $GAS_ADJUSTMENT --gas-prices $GAS_PRICE -o json -y | jq '.'
              sleep $(($COMMIT_TIMEOUT*2)) 
              echo "> Post-delegation tokens:"
              $CHAIN_BINARY q staking validator $VALOPER_1 --home $whale_home -o json | jq '.validator.tokens'
              echo "> Outstanding rewards for Val1 after delegation:"
              $CHAIN_BINARY q distribution validator-outstanding-rewards $VALOPER_1 --home $whale_home -o json | jq '.'

          - name: _Test auth module
            run: |
              source scripts/vars.sh
              tests/test_auth.sh

          - name: _Test authz module
            run: |
              source scripts/vars.sh
              tests/test_authz.sh

          - name: _Test validator jailing and slashing
            run: |
              source scripts/vars.sh
              export validator_count=12
              tests/test_downtime.sh

          - name: Restart relayer
            run: |
              tmux send-keys -t relayer C-c
              sleep $(($COMMIT_TIMEOUT*2))
              scripts/start_relayer.sh

          - name: _Test PFM transfers
            run: |
              tests/test_pfm_transfers.sh

          - name: Post-upgrade x/liquid happy path
            run: |
              source scripts/vars.sh
              tests/test_liquid_happy_path.sh

          - name: Tokenize with upgrade_wallet
            run: |
              source scripts/vars.sh
              upgrade_wallet=$($CHAIN_BINARY keys list --home $whale_home --output json | jq -r '.[] | select(.name=="upgrade_wallet").address')
              echo "> Delegating."
              $CHAIN_BINARY tx staking delegate $VALOPER_1 1000000uatom --from upgrade_wallet -o json --gas auto --gas-adjustment $GAS_ADJUSTMENT --gas-prices $GAS_PRICE -y --home $whale_home
              sleep $(($COMMIT_TIMEOUT+2))
              echo "> Tokenizing."
              echo "> Command: $CHAIN_BINARY tx liquid tokenize-share $VALOPER_1 1000000$DENOM $upgrade_wallet --from upgrade_wallet -o json --gas auto --gas-adjustment $GAS_ADJUSTMENT --gas-prices $GAS_PRICE -y --home $whale_home"
              $CHAIN_BINARY tx liquid tokenize-share $VALOPER_1 1000000$DENOM $upgrade_wallet --from upgrade_wallet -o json --gas auto --gas-adjustment $GAS_ADJUSTMENT --gas-prices $GAS_PRICE -y --home $whale_home
              sleep $(($COMMIT_TIMEOUT+2))
              $CHAIN_BINARY q bank balances $upgrade_wallet --home $whale_home -o json | jq '.'
          
          - name: Redeem tokens with upgrade_wallet
            run: |
              source scripts/vars.sh
              upgrade_wallet=$($CHAIN_BINARY keys list --home $whale_home --output json | jq -r '.[] | select(.name=="upgrade_wallet").address')
              $CHAIN_BINARY q bank balances $upgrade_wallet --home $whale_home -o json | jq '.'
              liquid_denom=$($CHAIN_BINARY q bank balances $upgrade_wallet --home $whale_home -o json | jq -r --arg valoper "$VALOPER_1" '.balances | map(select(.denom | startswith($valoper))) | .[-1].denom')
              $CHAIN_BINARY q staking delegations $upgrade_wallet --home $whale_home -o json | jq '.'
              starting_delegation_amount=$($CHAIN_BINARY q staking delegations $upgrade_wallet --home $whale_home -o json | jq -r '.delegation_responses[0].balance.amount')
              echo "> Denom: $liquid_denom"
              echo "> Command: $CHAIN_BINARY tx liquid redeem-tokens 1000000$liquid_denom --from $whale_home -o json --gas auto --gas-adjustment $GAS_ADJUSTMENT --gas-prices $GAS_PRICE -y --home $whale_home"
              $CHAIN_BINARY tx liquid redeem-tokens 1000000$liquid_denom --from $upgrade_wallet -o json --gas auto --gas-adjustment $GAS_ADJUSTMENT --gas-prices $GAS_PRICE -y --home $whale_home
              sleep $(($COMMIT_TIMEOUT+2))
              $CHAIN_BINARY q bank balances $upgrade_wallet --home $whale_home -o json | jq '.'
              $CHAIN_BINARY q staking delegations $upgrade_wallet --home $whale_home -o json | jq '.'
              ending_delegation_amount=$($CHAIN_BINARY q staking delegations $upgrade_wallet --home $whale_home -o json | jq -r '.delegation_responses[0].balance.amount')
              diff=$(echo "$ending_delegation_amount - $starting_delegation_amount" | bc)
              echo "> Difference in delegation amount: $diff"
              if [[ "$diff" == "1000000" ]]; then
                  echo "Token redemption succeeded."
              else
                  echo "Token redemption failed."
                  exit 1
              fi
    
          - name: _Test ICA send
            run: |
              source scripts/vars.sh
              controller1=$($CHAIN_BINARY keys list --home $whale_home --output json | jq -r '.[] | select(.name=="controller1").address')
              $CHAIN_BINARY keys add recipient2 --home $whale_home
              recipient_wallet=$($CHAIN_BINARY keys list --home $whale_home --output json | jq -r '.[] | select(.name=="recipient2").address')
              tests/test_ica_send.sh $controller1 $recipient_wallet

          - name: _Test counter contract
            run: |
              source scripts/vars.sh
              tests/test_contract_counter.sh

          - name: _Test multisig contract
            run: |
              source scripts/vars.sh
              tests/test_contract_multisig.sh

          - name: Create and mint factory denom
            run: |
              source scripts/vars.sh
              scripts/factory_create_mint_denom.sh
          
          - name: Test factory denom transfer with PFM
            run: |
              tests/test_factory_pfm_transfer.sh

          - name: Test multi-send gas consumption is within expected range
            run: |
              source scripts/vars.sh
              tests/test_multisend_gas_consumption.sh surcharge

          - name: Set staking params to bump max validators to 200
            run: |
              source scripts/vars.sh
              export validator_count=12
              echo "> Before:"
              $CHAIN_BINARY q staking params --home $whale_home -o json | jq '.'
              scripts/param_change.sh templates/proposal-staking-params.json
              echo "> After:"
              $CHAIN_BINARY q staking params --home $whale_home -o json | jq '.'
              sleep 30s
              echo "> Whale: "
              tail -n 200 $whale_log
              echo "> Val 02:"
              tail -n 200 ${moniker_prefix}02${log_suffix}
              echo "> Val 03:"
              tail -n 200 ${moniker_prefix}03${log_suffix}
              echo "> Val 12:"
              tail -n 200 ${moniker_prefix}12${log_suffix}
              tests/test_block_production.sh 127.0.0.1 ${rpc_prefix}02 5
              tests/test_block_production.sh 127.0.0.1 ${rpc_prefix}03 5
              tail -n 200 $whale_log

          - name: _State sync test
            run: |
              source scripts/vars.sh
              echo "> Sleeping $[ $COMMIT_TIMEOUT * $STATE_SYNC_SNAPSHOT_INTERVAL ] seconds for state sync to be ready"
              sleep $[ $COMMIT_TIMEOUT * $STATE_SYNC_SNAPSHOT_INTERVAL ]
              source scripts/vars_state_sync.sh
              scripts/setup_state_sync.sh
              ./$START_SCRIPT
              sleep 1m
              cat statesync.log
              tests/test_block_production.sh 127.0.0.1 ${rpc_prefix}999 5


          - name: _Test create validator
            run: |
              # Must be run after state sync test: that node is used to create the validator
              source scripts/vars.sh
              source scripts/vars_state_sync.sh
              tests/test_create_validator.sh

          - name: _Test API endpoints
            run: |
              source scripts/vars.sh
              tests/test_endpoints_api.sh localhost ${api_prefix}$COUNT_WIDTH

          - name: _Test RPC endpoints
            run: |
              source scripts/vars.sh
              tests/test_endpoints_rpc.sh localhost ${rpc_prefix}$COUNT_WIDTH

          - name: Stop chain
            run: |
              source scripts/vars.sh
              ./$STOP_SCRIPT
              sleep 10s
              tail -n 100 $whale_log
              # tmux list-sessions
              source scripts/vars_state_sync.sh
              ./$STOP_SCRIPT
              sleep 10s

          - name: Build fork binary
            run: |
              source scripts/vars.sh
              export FORK_BINARY=$HOME/go/bin/gaiad-fork
              git clone https://github.com/cosmos/gaia.git fork-build
              pushd fork-build
              git checkout ${{ matrix.target_version }}
              make build BUILD_TAGS="-tag unsafe_start_local_validator"
              cp build/gaiad $FORK_BINARY
              popd
          
          - name: Fork chain
            run: |
              export FORK_BINARY=$HOME/go/bin/gaiad-fork
              export FORK_HOME=$HOME/.gaia-fork
              source scripts/vars.sh
              scripts/fork.sh

          - name: Start forked chain
            run: |
              export FORK_HOME=$HOME/.gaia-fork
              source scripts/vars.sh
              $CHAIN_BINARY start --home $FORK_HOME > fork.log 2>&1 &
              FORK_PID=$!
              echo "Forked chain started with PID $FORK_PID"
              sleep 10
              cat fork.log

          - name: _Blocks produced on forked chain
            run: |
              source scripts/vars.sh
              tests/test_block_production.sh 127.0.0.1 26657

          - name: Check delegations on fork
            run: |
              export FORK_HOME=$HOME/.gaia-fork
              source scripts/vars.sh
              $CHAIN_BINARY q staking delegations cosmos1ay4dpm0kjmvtpug28vgw5w32yyjxa5sp97pjqq --home $FORK_HOME -o json | jq '.'
              starting_delegation=$($CHAIN_BINARY q staking delegations cosmos1ay4dpm0kjmvtpug28vgw5w32yyjxa5sp97pjqq --home $FORK_HOME -o json | jq -r '.delegation_responses[] | select(.delegation.validator_address=="cosmosvaloper1ay4dpm0kjmvtpug28vgw5w32yyjxa5spq248vn").balance.amount')
              $CHAIN_BINARY tx staking delegate cosmosvaloper1ay4dpm0kjmvtpug28vgw5w32yyjxa5spq248vn 10000000uatom --from cosmos1ay4dpm0kjmvtpug28vgw5w32yyjxa5sp97pjqq --gas $GAS --gas-adjustment $GAS_ADJUSTMENT --gas-prices $GAS_PRICE --home $FORK_HOME -y
              sleep $(($COMMIT_TIMEOUT*2))
              $CHAIN_BINARY q staking delegations cosmos1ay4dpm0kjmvtpug28vgw5w32yyjxa5sp97pjqq --home $FORK_HOME -o json | jq '.'
              $CHAIN_BINARY tx staking delegate cosmosvaloper1ay4dpm0kjmvtpug28vgw5w32yyjxa5spq248vn 10000000uatom --from cosmos1ay4dpm0kjmvtpug28vgw5w32yyjxa5sp97pjqq --gas $GAS --gas-adjustment $GAS_ADJUSTMENT --gas-prices $GAS_PRICE --home $FORK_HOME -y
              sleep $(($COMMIT_TIMEOUT*2))
              $CHAIN_BINARY q staking delegations cosmos1ay4dpm0kjmvtpug28vgw5w32yyjxa5sp97pjqq --home $FORK_HOME -o json | jq '.'
              ending_delegation=$($CHAIN_BINARY q staking delegations cosmos1ay4dpm0kjmvtpug28vgw5w32yyjxa5sp97pjqq --home $FORK_HOME -o json | jq -r '.delegation_responses[] | select(.delegation.validator_address=="cosmosvaloper1ay4dpm0kjmvtpug28vgw5w32yyjxa5spq248vn").balance.amount')
              echo "> Verify delegations are present and correct"
              diff=$(echo "$ending_delegation - $starting_delegation" | bc)
              if [[ $diff -ne 20000000 ]]; then
                echo "> FAIL: Delegation amount after delegations is incorrect. Expected 20000000 more than starting delegation, got $diff"
                exit 1
              else
                echo "> PASS: Delegation amount after delegations is correct. Expected 20000000 more than starting delegation, got $diff"
              fi
